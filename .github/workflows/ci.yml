name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      - run: swift test -c release

  linux:
    runs-on: ubuntu-latest
    container: swift:6.1-jammy
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      - run: swift test -c release

  sanitizers:
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v4
      - run: swift test --sanitize=${{ matrix.sanitizer }}

  stress:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Replay generated state machines across seeds
        run: |
          for seed in 1 2 3 5 8 13 21 34; do
            TALLY_TEST_SEED=$seed swift test -c release
          done
